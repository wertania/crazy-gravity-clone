# Nginx server block for the built game. Static files only - there is no
# server side, no database and no state to keep.

# Compress on the fly. The JS bundle is 684 kB and goes out at 178 kB, which on
# mobile data is the difference between a snappy load and a long stare at the
# loading screen. (Pre-compressing at build time and
# serving with `gzip_static on` would save the CPU, but that module is not
# guaranteed to be present in every nginx build - an unknown directive is a
# container that refuses to start, so this stays on the safe path.)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/wasm
  image/svg+xml;

server {
  # IPv4 only, deliberately. A `listen [::]:80` here is a container that
  # refuses to start ("Address family not supported by protocol") on any host
  # where IPv6 is switched off in the container's network namespace, and it
  # buys nothing: Coolify's proxy terminates the public connection - v4 or v6 -
  # and reaches this container over the internal network.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Without this, text/html and text/css go out with no charset at all, and any
  # non-ASCII in the interface is at the mercy of the browser's guess.
  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript;

  server_tokens off;

  # Container health probe. An exact-match location, so it wins over the prefix
  # rules below and inherits none of their caching headers, and it is kept out
  # of the access log so a 30-second interval does not drown the interesting
  # lines.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite fingerprints every file under /assets/, so the name changes whenever
  # the content does and these can be cached hard and forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Everything else - in practice index.html, which is the only unfingerprinted
  # file. `no-cache` still allows the browser to store it; it just has to
  # revalidate, so a deploy is picked up on the next load instead of whenever
  # the cache happens to expire.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
