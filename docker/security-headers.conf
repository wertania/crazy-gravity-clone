# Response headers shared by every location block.
#
# This file lives in /etc/nginx/snippets rather than /etc/nginx/conf.d because
# the main nginx.conf globs `conf.d/*.conf` into the http context - a stray
# copy there would apply these headers a second time, globally.
#
# It has to be included in *each* location: an `add_header` inside a location
# discards every header inherited from the enclosing block rather than adding
# to it, which is the classic way security headers vanish from exactly the
# responses that matter.

# The game is entirely self-contained: no CDN, no analytics, no fonts, no API.
# The one concession is 'unsafe-inline'. The loading screen's markup, styles
# and progress script are inline in index.html on purpose - an external
# stylesheet is render-blocking and an external script cannot run until it has
# itself been downloaded, which is the very wait the screen exists to cover.
# `data:` in img-src is the emoji favicon.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

# Same-origin framing only. To embed the game on another site, replace
# `frame-ancestors 'self'` above with that site's origin and drop the
# X-Frame-Options line below - the two must agree, and browsers that
# understand both prefer the CSP.
add_header X-Frame-Options "SAMEORIGIN" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, a microphone or a location fix.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
